services:
  postgres:
    image: postgres:15
    container_name: todos-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: todos_db
    ports:
      - "5433:5432"
    volumes:
      - todos-postgres-data:/var/lib/postgresql/data

volumes:
  todos-postgres-data: